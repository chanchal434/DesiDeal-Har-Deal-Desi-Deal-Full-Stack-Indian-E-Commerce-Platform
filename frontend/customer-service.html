<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Customer Service - DesiDeal</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    .cs-hero { background: #fff; padding: 40px 20px; text-align: center; border-bottom: 1px solid #ddd; }
    .cs-hero h1 { font-size: 32px; color: #111; margin-bottom: 10px; }
    
    .cs-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .ticket-card { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .ticket-card h2 { font-size: 22px; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
    
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 14px; box-sizing: border-box;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
        border-color: #FF9933; outline: none; box-shadow: 0 0 0 3px rgba(255,153,51,0.15);
    }
  </style>
</head>
<body style="background-color: #f4f6f8;">

<header id="main-header">
  <div class="container header-inner">
    <a href="index.html" id="logo" style="flex-direction: column; align-items: flex-start; gap: 0; text-decoration: none;">
      <div><span class="logo-main">DesiDeal</span><span class="logo-dot">.in</span></div>
    </a>
    <div id="header-actions">
      <div class="header-btn" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <i class="fas fa-arrow-left"></i><span class="bold-label" style="margin-left:8px;">Back to Store</span>
      </div>
    </div>
  </div>
</header>

<section class="cs-hero">
    <h1>How can we help you today?</h1>
    <p style="color: #555;">Browse help topics or submit a support ticket below.</p>
</section>

<main class="cs-container">
    <div class="ticket-card">
        <h2>Submit a Support Ticket</h2>
        <form onsubmit="handleSupportTicket(event)">
            <div class="form-group">
                <label>What do you need help with?</label>
                <select id="ticket-subject" required>
                    <option value="">Select an option...</option>
                    <option value="Order Status / Tracking">Order Status / Tracking</option>
                    <option value="Returns & Refunds">Returns & Refunds</option>
                    <option value="Payment Issue">Payment Issue</option>
                    <option value="Account Management">Account Management</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>Please describe your issue</label>
                <textarea id="ticket-message" rows="6" placeholder="Provide as many details as possible..." required></textarea>
            </div>
            <button type="submit" class="btn-primary full-width" style="padding: 12px; font-size: 16px;">Submit Ticket</button>
        </form>
    </div>
</main>

<div id="toast-container"></div>
<script src="js/main.js"></script>
</body>
</html>
