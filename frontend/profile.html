<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile - DesiDeal</title>
  
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
  
  <style>
    /* ─── PROFESSIONAL PROFILE CSS ─── */
    body { background-color: #f4f6f8; }
    
    .profile-container { display: grid; grid-template-columns: 260px 1fr; gap: 30px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }

    /* Modern Sidebar */
    .profile-menu { background: #fff; border: none; border-radius: 12px; padding: 20px 0; height: fit-content; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .profile-menu ul { list-style: none; padding: 0; margin: 0; }
    .profile-menu li a { display: flex; align-items: center; gap: 12px; padding: 14px 24px; color: #444; text-decoration: none; font-weight: 500; font-size: 15px; transition: all 0.2s ease; border-left: 4px solid transparent; }
    .profile-menu li a i { width: 20px; text-align: center; color: #888; font-size: 18px; transition: color 0.2s ease; }
    .profile-menu li a:hover, .profile-menu li.active a { background: #fff8f5; color: #C7511F; border-left-color: #C7511F; }
    .profile-menu li a:hover i, .profile-menu li.active a i { color: #C7511F; }

    /* Content Area */
    .profile-content { background: #fff; border: none; border-radius: 12px; padding: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
    .section-header { border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 30px; }
    .section-header h2 { margin: 0; font-size: 24px; color: #111; font-weight: 600; }

    /* Avatar Header */
    .profile-header { display: flex; align-items: center; gap: 25px; margin-bottom: 40px; }
    .profile-avatar { width: 90px; height: 90px; background: linear-gradient(135deg, #FF9933, #e67e22); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 600; box-shadow: 0 4px 10px rgba(255,153,51,0.3); }
    .avatar-controls h3 { margin: 0 0 5px 0; font-size: 22px; color: #111; }
    .avatar-controls p { margin: 0 0 12px 0; color: #666; font-size: 14px; }

    /* Form Grids & Inputs */
    .profile-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .profile-form-grid.three-cols { grid-template-columns: repeat(3, 1fr); }
    
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #333; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; background: #fff; transition: border-color 0.2s, box-shadow 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: #FF9933; outline: none; box-shadow: 0 0 0 3px rgba(255,153,51,0.15); }
    .form-group input:disabled { background: #f8f9fa; color: #6c757d; cursor: not-allowed; border-color: #e9ecef; }

    /* Integrated Phone Input */
    .phone-group { display: flex; }
    .phone-group select { width: 35%; border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none; background: #f8f9fa; font-weight: 500; }
    .phone-group input { width: 65%; border-top-left-radius: 0; border-bottom-left-radius: 0; }

    /* Address Cards */
    .address-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
    .address-card { border: 1px solid #eaedf0; border-radius: 10px; padding: 24px; position: relative; background: #fff; transition: all 0.3s ease; display: flex; flex-direction: column; }
    .address-card:hover { border-color: #FF9933; box-shadow: 0 8px 20px rgba(0,0,0,0.06); transform: translateY(-3px); }
    .address-badge { position: absolute; top: 20px; right: 20px; background: #f0f2f5; color: #333; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
    .address-card h4 { margin: 0 0 12px 0; font-size: 17px; color: #111; padding-right: 60px; }
    .address-card p { margin: 0 0 6px 0; font-size: 14px; color: #555; line-height: 1.5; }
    .address-card .addr-phone { margin-top: 12px; font-weight: 500; color: #333; }
    .address-actions { margin-top: auto; border-top: 1px solid #f0f2f5; padding-top: 15px; display: flex; gap: 20px; }
    .address-actions button { background: none; border: none; color: #007185; cursor: pointer; font-size: 14px; font-weight: 600; padding: 0; transition: color 0.2s; }
    .address-actions button:hover { color: #C7511F; text-decoration: underline; }

    .add-address-card { border: 2px dashed #d1d5db; align-items: center; justify-content: center; cursor: pointer; color: #6b7280; min-height: 220px; background: #fafbfc; }
    .add-address-card:hover { border-color: #FF9933; color: #FF9933; background: #fffdfa; }
    .add-address-card i { font-size: 36px; margin-bottom: 12px; }

    /* Save Button */
    .btn-save { padding: 12px 35px; font-size: 16px; border-radius: 6px; margin-top: 10px; box-shadow: 0 4px 10px rgba(255,153,51,0.2); transition: all 0.2s ease; }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255,153,51,0.3); }

    /* Modal for Addresses */
    #address-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(3px); z-index: 3000; opacity: 0; pointer-events: none; transition: 0.3s; }
    #address-modal-overlay.active { opacity: 1; pointer-events: all; }
    #address-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95); background: #fff; width: 90%; max-width: 650px; border-radius: 12px; padding: 40px; z-index: 3001; opacity: 0; pointer-events: none; transition: 0.3s; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    #address-modal.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: all; }

    @media (max-width: 900px) {
        .profile-container { grid-template-columns: 1fr; }
        .profile-form-grid.three-cols { grid-template-columns: 1fr; }
        .profile-form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header id="main-header">
  <div class="container header-inner">
    <a href="index.html" id="logo" style="flex-direction: column; align-items: flex-start; gap: 0; text-decoration: none;">
      <div><span class="logo-main">DesiDeal</span><span class="logo-dot">.in</span></div>
    </a>
    <div id="header-actions">
      <div class="header-btn" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <i class="fas fa-arrow-left"></i><span class="bold-label" style="margin-left:8px;">Back to Store</span>
      </div>
    </div>
  </div>
</header>

<main class="profile-container">
    <aside class="profile-menu">
        <ul>
            <li class="active"><a href="profile.html"><i class="fas fa-user-cog"></i> Account Overview</a></li>
            <li><a href="orders.html"><i class="fas fa-box-open"></i> Your Orders</a></li>
            <li><a href="wishlist.html"><i class="fas fa-heart"></i> Wishlist</a></li>
            <li><a href="security.html"><i class="fas fa-shield-alt"></i> Security & Privacy</a></li>
            <li style="border-top: 1px solid #f0f2f5; margin-top: 10px; padding-top: 10px;"><a href="#" onclick="window.handleSignOut(); window.location.href='index.html'"><i class="fas fa-sign-out-alt"></i> Sign Out</a></li>
        </ul>
    </aside>

    <section class="profile-content">
        <div class="section-header">
            <h2>Personal Information</h2>
        </div>
        
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-display">U</div>
            <div class="avatar-controls">
                <h3 id="display-name">Loading...</h3>
                <p id="display-email">loading@email.com</p>
                <button class="btn-outline-dark" style="padding: 8px 16px; font-size: 13px; border-radius: 6px;"><i class="fas fa-camera"></i> Change Photo</button>
            </div>
        </div>

        <form id="profile-update-form">
            <div class="profile-form-grid three-cols">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="prof-fname" required />
                </div>
                <div class="form-group">
                    <label>Middle Name</label>
                    <input type="text" id="prof-mname" placeholder="Optional" />
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="prof-lname" required />
                </div>
            </div>

            <div class="profile-form-grid three-cols">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="prof-email" disabled title="Contact support to change email" />
                </div>
                <div class="form-group">
                    <label>Date of Birth</label>
                    <input type="date" id="prof-dob" />
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="prof-gender">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                        <option value="prefer-not">Prefer not to say</option>
                    </select>
                </div>
            </div>

            <div class="profile-form-grid">
                <div class="form-group">
                    <label>Primary Mobile Number</label>
                    <div class="phone-group">
                        <select id="prof-country-code">
                            <option value="+91">+91 (IND)</option>
                            <option value="+1">+1 (USA)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+61">+61 (AUS)</option>
                            <option value="+971">+971 (UAE)</option>
                        </select>
                        <input type="tel" id="prof-phone" placeholder="10-digit number" maxlength="15" />
                    </div>
                </div>
                <div class="form-group">
                    <label>Alternate Mobile Number</label>
                    <div class="phone-group">
                        <select id="prof-alt-country-code">
                            <option value="+91">+91 (IND)</option>
                            <option value="+1">+1 (USA)</option>
                            <option value="+44">+44 (UK)</option>
                            <option value="+61">+61 (AUS)</option>
                            <option value="+971">+971 (UAE)</option>
                        </select>
                        <input type="tel" id="prof-alt-phone" placeholder="Optional" maxlength="15" />
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-gold btn-save">Save Personal Info</button>
        </form>

        <br><br><br>

        <div class="section-header">
            <h2>Address Book</h2>
        </div>
        <div class="address-grid" id="address-grid">
            <div class="address-card add-address-card" onclick="openAddressModal()">
                <i class="fas fa-plus-circle"></i>
                <span style="font-weight: 600;">Add New Address</span>
            </div>
        </div>
    </section>
</main>

<div id="address-modal-overlay" onclick="closeAddressModal()"></div>
<div id="address-modal">
    <button class="modal-close-btn" onclick="closeAddressModal()" style="position:absolute; right:20px; top:20px; background:none; border:none; font-size:24px; cursor:pointer; color:#888;"><i class="fas fa-times"></i></button>
    <h2 style="margin-top:0; font-size: 24px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 25px;">Add a new address</h2>
    
    <form id="address-form" onsubmit="saveNewAddress(event)">
        <div class="profile-form-grid" style="margin-bottom: 20px;">
            <div class="form-group">
                <label>Receiver's Name</label>
                <input type="text" id="addr-name" placeholder="First and Last name" required />
            </div>
            <div class="form-group">
                <label>Mobile number</label>
                <input type="tel" id="addr-phone" placeholder="Delivery updates" required maxlength="15" />
            </div>
        </div>
        
        <div class="profile-form-grid" style="margin-bottom: 20px;">
            <div class="form-group">
                <label>Pincode / ZIP</label>
                <input type="text" id="addr-pin" placeholder="6 digits" required maxlength="10" />
            </div>
            <div class="form-group">
                <label>Address Type</label>
                <select id="addr-type" required>
                    <option value="Home">Home (7am - 9pm)</option>
                    <option value="Office">Office (10am - 6pm)</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="form-group" style="margin-bottom: 20px;">
            <label>Flat, House no., Building, Company, Apartment</label>
            <input type="text" id="addr-line1" required />
        </div>
        <div class="form-group" style="margin-bottom: 20px;">
            <label>Area, Street, Sector, Village</label>
            <input type="text" id="addr-line2" required />
        </div>

        <div class="profile-form-grid" style="margin-bottom: 10px;">
            <div class="form-group">
                <label>Town / City</label>
                <input type="text" id="addr-city" required />
            </div>
            <div class="form-group">
                <label>State / Province</label>
                <input type="text" id="addr-state" required />
            </div>
        </div>
        
        <button type="submit" class="btn-gold full-width btn-save" style="margin-top: 15px;">Save Address</button>
    </form>
</div>

<div id="toast-container"></div>

<script src="js/main.js"></script>

<script>
    let globalAddresses = [];

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('desideal_token');
        if (!token) { window.location.href = 'index.html'; return; }

        try {
            const response = await fetch(`${StoreConfig.API_BASE}/profile`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (data.success) {
                // Populate Granular Name Data
                document.getElementById('prof-fname').value = data.user.first_name || '';
                document.getElementById('prof-mname').value = data.user.middle_name || '';
                document.getElementById('prof-lname').value = data.user.last_name || '';
                
                // Populate Emails and Basic Details
                document.getElementById('display-email').textContent = data.user.email || '';
                document.getElementById('prof-email').value = data.user.email || '';
                document.getElementById('prof-dob').value = data.user.dob || '';
                document.getElementById('prof-gender').value = data.user.gender || '';
                
                // Populate Phones with Country Codes
                document.getElementById('prof-country-code').value = data.user.country_code || '+91';
                document.getElementById('prof-phone').value = data.user.phone || '';
                
                if(data.user.alt_phone) {
                    // Assuming alt_phone is stored as "+91 9999999999", we split it, otherwise just display
                    document.getElementById('prof-alt-country-code').value = '+91'; 
                    document.getElementById('prof-alt-phone').value = data.user.alt_phone;
                }
                
                // Update UI Headers dynamically based on what was loaded
                const displayFirstName = data.user.first_name || 'User';
                const displayLastName = data.user.last_name || '';
                document.getElementById('display-name').textContent = `${displayFirstName} ${displayLastName}`.trim();
                document.getElementById('avatar-display').textContent = displayFirstName.charAt(0).toUpperCase();

                // Load Addresses
                globalAddresses = data.user.addresses || [];
                renderAddressGrid();
            }
        } catch (error) {
            UIManager.showToast('Failed to load profile data.', 'error');
        }
    });

    // ─── PERSONAL INFO SAVE ───
    document.getElementById('profile-update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        await updateProfileInDatabase("Personal information saved successfully!");
    });

    // ─── ADDRESS BOOK LOGIC ───
    function renderAddressGrid() {
        const grid = document.getElementById('address-grid');
        
        let html = `
            <div class="address-card add-address-card" onclick="openAddressModal()">
                <i class="fas fa-plus-circle"></i>
                <span style="font-weight: 600;">Add New Address</span>
            </div>
        `;

        globalAddresses.forEach((addr, index) => {
            html += `
                <div class="address-card">
                    <div class="address-badge">${addr.type}</div>
                    <h4>${addr.name}</h4>
                    <p>${addr.line1}<br>${addr.line2}</p>
                    <p>${addr.city}, ${addr.state} ${addr.pin}</p>
                    <p class="addr-phone">Phone: ${addr.phone}</p>
                    <div class="address-actions">
                        <button type="button" onclick="removeAddress(${index})"><i class="fas fa-trash-alt"></i> Remove</button>
                    </div>
                </div>
            `;
        });

        grid.innerHTML = html;
    }

    function openAddressModal() {
        document.getElementById('address-form').reset();
        document.getElementById('address-modal-overlay').classList.add('active');
        document.getElementById('address-modal').classList.add('active');
    }

    function closeAddressModal() {
        document.getElementById('address-modal-overlay').classList.remove('active');
        document.getElementById('address-modal').classList.remove('active');
    }

    async function saveNewAddress(e) {
        e.preventDefault();
        
        const newAddress = {
            name: document.getElementById('addr-name').value,
            phone: document.getElementById('addr-phone').value,
            pin: document.getElementById('addr-pin').value,
            line1: document.getElementById('addr-line1').value,
            line2: document.getElementById('addr-line2').value,
            city: document.getElementById('addr-city').value,
            state: document.getElementById('addr-state').value,
            type: document.getElementById('addr-type').value
        };

        globalAddresses.push(newAddress);
        await updateProfileInDatabase("New address added to Address Book!");
        
        closeAddressModal();
        renderAddressGrid();
    }

    async function removeAddress(index) {
        if(confirm("Are you sure you want to remove this address?")) {
            globalAddresses.splice(index, 1);
            await updateProfileInDatabase("Address removed.");
            renderAddressGrid();
        }
    }

    // ─── UTILITY TO SYNC WITH BACKEND ───
    async function updateProfileInDatabase(successMessage) {
        const token = localStorage.getItem('desideal_token');
        const updatedData = {
            first_name: document.getElementById('prof-fname').value,
            middle_name: document.getElementById('prof-mname').value,
            last_name: document.getElementById('prof-lname').value,
            country_code: document.getElementById('prof-country-code').value,
            phone: document.getElementById('prof-phone').value,
            alt_phone: document.getElementById('prof-alt-phone').value,
            dob: document.getElementById('prof-dob').value,
            gender: document.getElementById('prof-gender').value,
            addresses: globalAddresses 
        };

        try {
            const response = await fetch(`${StoreConfig.API_BASE}/profile`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify(updatedData)
            });
            const data = await response.json();
            
            if (data.success) {
                UIManager.showToast(`<i class="fas fa-check-circle"></i> ${successMessage}`, 'success');
                document.getElementById('display-name').textContent = data.name;
                document.getElementById('avatar-display').textContent = updatedData.first_name.charAt(0).toUpperCase();
                
                // Update LocalStorage so main.js header stays in sync
                localStorage.setItem('desideal_name', updatedData.first_name);
                UIManager.updateAuthUI();
            }
        } catch (error) {
            UIManager.showToast('Error syncing with database.', 'error');
        }
    }
</script>
</body>
</html>
