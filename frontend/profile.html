<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Profile - DesiDeal</title>
  
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css"/>
  
  <style>
    .profile-container {
        display: grid;
        grid-template-columns: 250px 1fr;
        gap: 30px;
        padding: 40px 20px;
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Sidebar Menu */
    .profile-menu {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 20px 0;
        height: fit-content;
    }
    .profile-menu ul { list-style: none; padding: 0; margin: 0; }
    .profile-menu li a {
        display: block;
        padding: 12px 20px;
        color: #111;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
    }
    .profile-menu li a:hover, .profile-menu li.active a {
        background: #f3f4f6;
        color: #C7511F;
        border-left: 4px solid #C7511F;
    }

    /* Content Area */
    .profile-content {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 30px;
    }
    .profile-content h2 { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; }

    /* Avatar / Photo */
    .profile-header {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 30px;
    }
    .profile-avatar {
        width: 100px;
        height: 100px;
        background: #FF9933;
        color: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: bold;
    }
    .avatar-controls button { margin-top: 10px; }

    /* Forms */
    .profile-form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }
    @media (max-width: 768px) {
        .profile-container { grid-template-columns: 1fr; }
        .profile-form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body style="background-color: #f3f4f6;">

<header id="main-header">
  <div class="container header-inner">
    <a href="index.html" id="logo" style="flex-direction: column; align-items: flex-start; gap: 0; text-decoration: none;">
      <div><span class="logo-main">DesiDeal</span><span class="logo-dot">.in</span></div>
    </a>
    <div id="header-actions">
      <div class="header-btn" onclick="window.location.href='index.html'" style="cursor: pointer;">
        <i class="fas fa-home"></i><span class="bold-label" style="margin-left:5px;">Back to Store</span>
      </div>
    </div>
  </div>
</header>

<main class="profile-container">
    <aside class="profile-menu">
        <ul>
            <li class="active"><a href="#"><i class="fas fa-user-cog"></i> Personal Info</a></li>
            <li><a href="#"><i class="fas fa-box-open"></i> Your Orders</a></li>
            <li><a href="#"><i class="fas fa-map-marker-alt"></i> Saved Addresses</a></li>
            <li><a href="#"><i class="fas fa-shield-alt"></i> Security & Settings</a></li>
            <li style="border-top: 1px solid #ddd; margin-top: 10px;"><a href="#" onclick="window.handleSignOut(); window.location.href='index.html'"><i class="fas fa-sign-out-alt"></i> Sign Out</a></li>
        </ul>
    </aside>

    <section class="profile-content">
        <h2>Personal Information</h2>
        
        <div class="profile-header">
            <div class="profile-avatar" id="avatar-display">U</div>
            <div class="avatar-controls">
                <h3 id="display-name">Loading...</h3>
                <p style="color: #565959; font-size: 14px;">Update your photo and personal details here.</p>
                <button class="btn-outline-dark" style="padding: 5px 10px; font-size: 12px;"><i class="fas fa-camera"></i> Change Photo</button>
            </div>
        </div>

        <form id="profile-update-form">
            <div class="profile-form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="prof-name" required />
                </div>
                <div class="form-group">
                    <label>Email Address (Cannot be changed)</label>
                    <input type="email" id="prof-email" disabled style="background:#eee; cursor:not-allowed;" />
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="prof-phone" placeholder="+91" />
                </div>
                <div class="form-group">
                    <label>Location / City</label>
                    <input type="text" id="prof-location" placeholder="e.g. Mumbai, India" />
                </div>
            </div>
            
            <div class="form-group" style="margin-top: 20px;">
                <label>Default Delivery Address</label>
                <textarea id="prof-address" rows="3" style="width: 100%; padding: 10px; border: 1px solid #a6a6a6; border-radius: 4px;"></textarea>
            </div>

            <button type="submit" class="btn-gold" style="padding: 10px 30px; font-size: 16px; margin-top: 10px;">Save Changes</button>
        </form>
    </section>
</main>

<div id="toast-container"></div>

<script src="js/main.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. Kick them out if they aren't logged in
        const token = localStorage.getItem('desideal_token');
        if (!token) {
            window.location.href = 'index.html';
            return;
        }

        // 2. Fetch their actual profile data from the backend
        try {
            const response = await fetch('http://localhost:5000/api/profile', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();

            if (data.success) {
                // Fill the form with their data
                document.getElementById('prof-name').value = data.user.name;
                document.getElementById('prof-email').value = data.user.email;
                document.getElementById('prof-phone').value = data.user.phone || '';
                document.getElementById('prof-location').value = data.user.location || '';
                document.getElementById('prof-address').value = data.user.address || '';
                
                // Update Avatar Letter and Name
                document.getElementById('display-name').textContent = data.user.name;
                document.getElementById('avatar-display').textContent = data.user.name.charAt(0).toUpperCase();
            }
        } catch (error) {
            console.error("Failed to load profile");
        }
    });

    // 3. Handle Saving Changes
    document.getElementById('profile-update-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = localStorage.getItem('desideal_token');

        const updatedData = {
            name: document.getElementById('prof-name').value,
            phone: document.getElementById('prof-phone').value,
            location: document.getElementById('prof-location').value,
            address: document.getElementById('prof-address').value
        };

        try {
            const response = await fetch('http://localhost:5000/api/profile', {
                method: 'PUT',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify(updatedData)
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Using the UIController from main.js to show a nice popup!
                UIController.showToast('<i class="fas fa-check"></i> Profile updated successfully!', 'success');
                document.getElementById('display-name').textContent = updatedData.name;
                document.getElementById('avatar-display').textContent = updatedData.name.charAt(0).toUpperCase();
                
                // Update their name in local storage so the main page header reflects the new name
                localStorage.setItem('desideal_name', updatedData.name.split(' ')[0]);
            }
        } catch (error) {
            UIController.showToast('Error saving profile.', 'error');
        }
    });
</script>
</body>
</html>
